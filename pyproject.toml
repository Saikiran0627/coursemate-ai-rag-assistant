[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coursemate-ai-rag-assistant"
version = "1.0.0"
description = "CourseMate: an LLM-powered retrieval-augmented course material assistant."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Manish Chowdary Kalluri" },
  { name = "Sai Kiran Sikilammetla" },
  { name = "Venkata Naga Kiran Katari" }
]
dependencies = [
  "chromadb>=1.3.0",
  "pandas>=2.3.0",
  "pypdf>=6.3.0",
  "python-docx>=1.2.0",
  "python-pptx>=1.0.0",
  "sentence-transformers>=5.1.0",
  "streamlit>=1.51.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
coursemate = "coursemate.cli:main"

[tool.setuptools.packages.find]
include = ["coursemate*"]
