[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coursemate-ai-rag-assistant"
version = "1.0.0"
description = "CourseMate: an LLM-powered retrieval-augmented course material assistant."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Manish Chowdary Kalluri" },
  { name = "Sai Kiran Sikilammetla" },
  { name = "Venkata Naga Kiran Katari" }
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
coursemate = "coursemate.cli:main"

[tool.setuptools.packages.find]
include = ["coursemate*"]
